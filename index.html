<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101411"><link rel="icon" href="data:,"><title>Flash Signal</title><link rel="stylesheet" href="style.css?v=2"><script defer src="vendor/mqtt.min.js"></script><script defer src="app.js?v=2"></script></head>
<body><main>
<section id="home"><div class="home-tools"><div class="mark" aria-hidden="true">ϟ</div><button id="gear" aria-label="Settings" title="Settings">⚙︎</button></div><h1>Flash Signal</h1><p>Open this link on both phones. Choose one role on each. The receiver screen flashes. Tap its dark screen to exit.</p>
<button id="sender">Sender <span>↗</span></button><button id="receiver">Receiver <span>↘</span></button></section>
<section id="settings" hidden>
<button class="back">← Back</button><h1>Settings</h1>
<label for="speed">Flash speed <small>Shared across all phones</small></label>
<select id="speed" disabled><option value="slow">Slow</option><option value="standard" selected>Standard</option><option value="fast">Fast</option></select>
<p id="sync" role="status"></p>
<label for="intensity">Flash intensity <small>This phone only</small></label>
<select id="intensity"><option value="soft">Soft</option><option value="medium">Medium</option><option value="bright" selected>Bright</option></select>
<button id="preview">Preview 3 flashes <span aria-hidden="true">▷</span></button>
<p class="hint">Tap the preview to stop.</p></section>
<section id="send" hidden><button class="back">← Change role</button><h1>Sender</h1><p id="status" role="status">Connecting…</p><div id="keys"></div><p id="result" role="status"></p></section>
<section id="receive" hidden><button class="back">← Change role</button><h1>Receiver</h1><p id="listen" role="status">Connecting…</p></section>
</main><button id="previewScreen" aria-label="Stop preview" hidden></button></body></html>
